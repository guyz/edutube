name: Weekly update & deploy

on:
  schedule:
    - cron: "17 6 * * 1" # every Monday 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: edutube
  cancel-in-progress: false

jobs:
  update:
    # Crawl only on the weekly schedule or a manual run; plain pushes just redeploy.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (always the newest yt-dlp - YouTube changes often)
        run: pip install --upgrade -r pipeline/requirements.txt
      - name: Fetch new talks and episodes
        run: python pipeline/ingest.py
      - name: Commit catalog
        run: |
          git config user.name "edutube-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/img pipeline/data
          git commit -m "Weekly catalog update $(date -u +%Y-%m-%d)" || echo "No changes"
          git push

  deploy:
    needs: update
    if: ${{ !cancelled() && (needs.update.result == 'success' || needs.update.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Publish site/ to the gh-pages branch
        env:
          PUBLISH_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: scripts/publish.sh

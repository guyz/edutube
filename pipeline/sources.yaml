# EduTube sources.
#
# YouTube sources (type: youtube):
#   id        short stable id (used in URLs and the catalog; don't rename)
#   channel   YouTube channel id (UC...)
#   filter    all    -> keep everything (after junk/short removal)
#             ai     -> keep only AI/ML-related videos
#             ai_sec -> keep AI/ML, security/privacy or cryptography videos
#   trusted   true for academic venues: skips the "generic engineering" exclusion
#   kind      default format: conference | workshop | seminar | lecture | tutorial | talk
#   topics    topics always attached to this source's items
#   include   regex; matching titles are kept even if the filter would drop them
#   exclude   regex; matching titles are always dropped
#   min_duration  seconds (default 240) - shorter videos are dropped
#
# Podcasts (type: podcast) are audio RSS feeds; they play in the background on iPhone.
#   style  academic | casual   (casual = business / news / chatty)

